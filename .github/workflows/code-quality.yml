name: Code Quality - Daily Code Analysis

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Job 1: Dependency Audit
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit auth-service
        run: |
          cd services/auth-service
          npm audit --json > audit-result.json || true
          cat audit-result.json

      - name: Audit parking-service
        run: |
          cd services/parking-service
          npm audit --json > audit-result.json || true
          cat audit-result.json

      - name: Audit payment-service
        run: |
          cd services/payment-service
          npm audit --json > audit-result.json || true
          cat audit-result.json

      - name: Check for high severity vulnerabilities
        run: |
          echo "checking for critical vulnerabilities"
          cd services/auth-service && npm audit --audit-level=high || echo "vulnerabilities found in auth-service"
          cd ../parking-service && npm audit --audit-level=high || echo "vulnerabilities found in parking-service"
          cd ../payment-service && npm audit --audit-level=high || echo "vulnerabilities found in payment-service"

  # Job 2: Code Complexity Analysis
  complexity:
    name: Code Complexity Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Count lines of code
        run: |
          echo "lines of code analysis"
          echo "auth-service:"
          find services/auth-service/src -name "*.ts" | xargs wc -l | tail -1
          echo "parking-service:"
          find services/parking-service/src -name "*.ts" | xargs wc -l | tail -1
          echo "payment-service:"
          find services/payment-service/src -name "*.ts" | xargs wc -l | tail -1

      - name: Check for large files
        run: |
          echo "checking for large files over 500 lines"
          find services/*/src -name "*.ts" -type f -exec sh -c 'lines=$(wc -l < "$1"); if [ $lines -gt 500 ]; then echo "$1: $lines lines"; fi' _ {} \;

  # Job 3: Outdated Dependencies
  outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check outdated packages
        run: |
          echo "checking for outdated packages"
          cd services/auth-service && npm outdated || true
          cd ../parking-service && npm outdated || true
          cd ../payment-service && npm outdated || true
          cd ../../aggregator && npm outdated || true

  # Job 4: Database Schema Check
  database-check:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Prisma schema files
        run: |
          echo "validating prisma schemas"
          cd services/auth-service && npm ci && npx prisma validate
          cd ../parking-service && npm ci && npx prisma validate
          cd ../payment-service && npm ci && npx prisma validate

      - name: Check for pending migrations
        run: |
          echo "checking for pending migrations"
          find services/*/prisma/migrations -type f -name "*.sql" | wc -l

  # Job 5: Code Quality Summary
  summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, complexity, outdated, database-check]
    if: always()
    
    steps:
      - name: Generate report
        run: |
          echo "daily code quality report"
          echo "timestamp: $(date)"
          echo "dependency audit: ${{ needs.dependency-audit.result }}"
          echo "complexity check: ${{ needs.complexity.result }}"
          echo "outdated check: ${{ needs.outdated.result }}"
          echo "database check: ${{ needs.database-check.result }}"
          
          if [ "${{ needs.dependency-audit.result }}" == "failure" ]; then
            echo "warning: dependency audit failed"
          fi
          
          echo "quality check completed"
