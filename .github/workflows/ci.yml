name: CI - Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Code Quality & Linting
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install service dependencies
        run: |
          cd services/auth-service && npm ci
          cd ../parking-service && npm ci
          cd ../payment-service && npm ci
          cd ../../aggregator && npm ci

      - name: Check code formatting
        run: |
          npx prettier --check "services/**/*.{ts,js,json}"
          npx prettier --check "aggregator/**/*.{ts,js,json}"
        continue-on-error: true

      - name: Lint TypeScript files
        run: |
          cd services/auth-service && npm run lint || true
          cd ../parking-service && npm run lint || true
          cd ../payment-service && npm run lint || true
        continue-on-error: true

  # Job 2: Build Services
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        service: [auth-service, parking-service, payment-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd services/${{ matrix.service }} && npm ci

      - name: Generate Prisma Client
        run: cd services/${{ matrix.service }} && npx prisma generate

      - name: TypeScript Check
        run: cd services/${{ matrix.service }} && npx tsc --noEmit

  # Job 3: Database Migration Check
  database:
    name: Database Migration Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        service: [auth-service, parking-service, payment-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd services/${{ matrix.service }} && npm ci

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          cd services/${{ matrix.service }}
          npx prisma migrate deploy

  # Job 4: Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          cd services/auth-service && npm audit --audit-level=moderate || true
          cd ../parking-service && npm audit --audit-level=moderate || true
          cd ../payment-service && npm audit --audit-level=moderate || true
          cd ../../aggregator && npm audit --audit-level=moderate || true

  # Job 5: Docker Build Test
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose
        run: |
          docker-compose config
          echo "docker compose configuration is valid"

  # Job 6: Integration Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, build, database, security, docker]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          echo "ci pipeline complete"
          echo "lint: ${{ needs.lint.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "database: ${{ needs.database.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "docker: ${{ needs.docker.result }}"
