services:
    # PostgreSQL Databases

    postgres-auth:
        image: postgres:16-alpine
        container_name: smart-parking-postgres-auth
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${AUTH_DB_NAME}
        ports:
            - "${AUTH_DB_PORT}:5432"
        volumes:
            - postgres-auth-data:/var/lib/postgresql/data
        networks:
            - parking-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-parking:
        image: postgres:16-alpine
        container_name: smart-parking-postgres-parking
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${PARKING_DB_NAME}
        ports:
            - "${PARKING_DB_PORT}:5432"
        volumes:
            - postgres-parking-data:/var/lib/postgresql/data
        networks:
            - parking-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PARKING_DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-payment:
        image: postgres:16-alpine
        container_name: smart-parking-postgres-payment
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${PAYMENT_DB_NAME}
        ports:
            - "${PAYMENT_DB_PORT}:5432"
        volumes:
            - postgres-payment-data:/var/lib/postgresql/data
        networks:
            - parking-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PAYMENT_DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Microservices

    auth-service:
        build:
            context: ./services/auth-service
            dockerfile: Dockerfile
        container_name: smart-parking-auth-service
        env_file:
            - ./services/auth-service/.env.docker
        ports:
            - "3001:3001"
        depends_on:
            postgres-auth:
                condition: service_healthy
        networks:
            - parking-network
        restart: unless-stopped
        volumes:
            - ./services/auth-service/src:/app/src:ro

    parking-service:
        build:
            context: ./services/parking-service
            dockerfile: Dockerfile
        container_name: smart-parking-parking-service
        env_file:
            - ./services/parking-service/.env.docker
        ports:
            - "3002:3002"
        depends_on:
            postgres-parking:
                condition: service_healthy
            auth-service:
                condition: service_started
        networks:
            - parking-network
        restart: unless-stopped
        volumes:
            - ./services/parking-service/src:/app/src:ro

    payment-service:
        build:
            context: ./services/payment-service
            dockerfile: Dockerfile
        container_name: smart-parking-payment-service
        env_file:
            - ./services/payment-service/.env.docker
        ports:
            - "3003:3003"
        depends_on:
            postgres-payment:
                condition: service_healthy
            auth-service:
                condition: service_started
        networks:
            - parking-network
        restart: unless-stopped
        volumes:
            - ./services/payment-service/src:/app/src:ro

    gateway:
        build:
            context: .
            dockerfile: ./aggregator/Dockerfile
        container_name: smart-parking-gateway
        env_file:
            - ./aggregator/.env.docker
        ports:
            - "3000:3000"
        depends_on:
            - auth-service
            - parking-service
            - payment-service
        networks:
            - parking-network
        restart: unless-stopped

# Networks

networks:
    parking-network:
        driver: bridge
        name: smart-parking-network

# Volumes (Persistent Data)

volumes:
    postgres-auth-data:
        name: smart-parking-auth-db-data
    postgres-parking-data:
        name: smart-parking-parking-db-data
    postgres-payment-data:
        name: smart-parking-payment-db-data
